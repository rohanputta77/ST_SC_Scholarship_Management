<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STSC AI-Enabled Scholarship Management Prototype</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: white; margin: 0; padding: 0; display: flex; flex-direction: column; min-height: 100vh;}
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .tab-btn { padding: 1rem 2rem; font-weight: 600; color: #94a3b8; transition: all 0.3s; border-bottom: 2px solid transparent; }
        .tab-btn.active { color: #38bdf8; border-bottom-color: #38bdf8; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        function App() {
            const [activeTab, setActiveTab] = React.useState('applicant');
            const [draftSaved, setDraftSaved] = React.useState(false);
            const [formData, setFormData] = React.useState({ fullName: '', dob: '', aadhaarMasked: '', course: '', university: '' });
            const [digiDocs, setDigiDocs] = React.useState([]);
            const [submitting, setSubmitting] = React.useState(false);
            const [submitted, setSubmitted] = React.useState(false);

            const handleFormChange = (field, value) => {
                setFormData(prev => ({ ...prev, [field]: value }));
                setDraftSaved(false);
                setTimeout(() => setDraftSaved(true), 800);
            };

            const fetchDigiLocker = () => {
                setDigiDocs([
                    { name: 'ST_Certificate.pdf', status: 'verified', icon: 'file-check' },
                    { name: 'Income_Certificate.pdf', status: 'verified', icon: 'file-check' },
                    { name: 'Marksheet_MSc.pdf', status: 'verified', icon: 'file-check' },
                ]);
            };

            const handleSubmit = () => {
                setSubmitting(true);
                setTimeout(() => { setSubmitting(false); setSubmitted(true); }, 2000);
            };

            React.useEffect(() => {
                lucide.createIcons();
            }, [activeTab]);

            const renderScrutiny = () => (
                <div className="flex h-[calc(100vh-80px)] overflow-hidden">
                    {/* Left: Document Viewer */}
                    <div className="flex-[3] border-r border-white/10 p-6 flex flex-col bg-black/40">
                        <div className="flex gap-2 mb-4">
                            <button className="px-4 py-2 bg-white/20 rounded-lg text-sm font-semibold border border-white/10">ST_Certificate.pdf</button>
                            <button className="px-4 py-2 bg-white/5 rounded-lg text-sm font-semibold border border-white/5 text-slate-400">Income_Certificate.pdf</button>
                        </div>
                        <div className="flex-1 glass rounded-xl flex flex-col items-center justify-center text-slate-500 relative overflow-hidden">
                            <i data-lucide="file-text" className="w-16 h-16 opacity-20 mb-4"></i>
                            <p className="font-semibold text-lg text-slate-300">ST_Certificate.pdf (Simulated View)</p>
                            <div className="absolute inset-x-10 inset-y-32 bg-slate-800/80 p-8 rounded border border-slate-700 font-mono text-sm text-left shadow-2xl">
                                GOVERNMENT OF INDIA<br/><br/>
                                Name: Ananya Sharma<br/>
                                Community: <span className="bg-red-500/30 px-1 text-red-200">Sahariaa</span><br/>
                                Category: PVTG<br/>
                                Status: VALID<br/>
                            </div>
                        </div>
                    </div>

                    {/* Right: AI Exceptions */}
                    <div className="flex-[2] p-6 overflow-y-auto bg-slate-900/50">
                        <h2 className="text-xl font-bold mb-1">Ananya Sharma</h2>
                        <p className="text-sm text-slate-400 mb-6">ID: APP-NFST-00045</p>

                        <h3 className="text-lg font-bold text-red-400 flex items-center gap-2 mb-4">
                            <i data-lucide="shield-alert" className="w-5 h-5"></i> AI Exception Flags
                        </h3>
                        
                        <div className="bg-red-500/10 border border-red-500/30 p-4 rounded-xl mb-4 shadow-lg shadow-red-900/20">
                            <div className="flex justify-between items-start mb-2">
                                <span className="font-bold text-red-300">communityName</span>
                                <span className="bg-red-600 text-xs px-2 py-0.5 rounded font-bold uppercase">WARNING</span>
                            </div>
                            <p className="text-sm text-white/90">Community name 'Sahariaa' is a near-miss for a PVTG list entry (score: 94).</p>
                            <div className="mt-3 text-xs font-mono text-slate-400 bg-black/30 p-2 rounded">
                                Raw Confidence Score: 0.95
                            </div>
                        </div>

                        <div className="bg-orange-500/10 border border-orange-500/30 p-4 rounded-xl mb-8 shadow-lg shadow-orange-900/20">
                            <div className="flex justify-between items-start mb-2">
                                <span className="font-bold text-orange-300">fullName</span>
                                <span className="bg-orange-600 text-xs px-2 py-0.5 rounded font-bold uppercase">BLOCKING</span>
                            </div>
                            <p className="text-sm text-white/90">Name mismatch in ST_Certificate. Expected Ananya Sharma, fuzzy score 78.</p>
                        </div>

                        <h3 className="text-lg font-bold mb-4 border-b border-white/10 pb-2">Extracted Fields</h3>
                        <div className="space-y-3 text-sm">
                            <div className="flex justify-between"><span className="text-slate-400">Extracted Community:</span> <span className="font-semibold text-red-400">Sahariaa</span></div>
                            <div className="flex justify-between"><span className="text-slate-400">Income:</span> <span className="font-semibold">₹1,25,000</span></div>
                        </div>

                        <div className="mt-8 flex gap-3">
                            <button className="flex-1 bg-red-600 hover:bg-red-500 py-3 rounded-lg font-bold transition-colors">Reject (Deficiency)</button>
                            <button className="flex-1 bg-emerald-600 hover:bg-emerald-500 py-3 rounded-lg font-bold transition-colors">Override & Approve</button>
                        </div>
                    </div>
                </div>
            );

            const renderWhatIf = () => (
                <div className="p-8 h-[calc(100vh-80px)] overflow-y-auto">
                    <div className="grid grid-cols-2 gap-8">
                        <div className="glass p-6 rounded-2xl shadow-2xl border-amber-500/30">
                            <h2 className="text-xl font-bold mb-6 text-amber-400 border-b border-white/10 pb-2 flex items-center gap-2">
                                <i data-lucide="flask-conical" className="w-5 h-5"></i> Scheme Sandbox
                            </h2>
                            <div className="space-y-6">
                                <div>
                                    <h3 className="font-semibold mb-3 text-slate-300">Merit Formula Weights</h3>
                                    <div className="grid grid-cols-2 gap-4">
                                        <div className="bg-black/30 p-4 rounded-lg border border-white/5">
                                            <label className="text-sm text-slate-400 block mb-1">NET Score Weight (%)</label>
                                            <input type="number" defaultValue={60} className="w-full bg-slate-800 p-2 rounded text-amber-400 font-bold outline-none" />
                                        </div>
                                        <div className="bg-black/30 p-4 rounded-lg border border-white/5">
                                            <label className="text-sm text-slate-400 block mb-1">Master's Weight (%)</label>
                                            <input type="number" defaultValue={40} className="w-full bg-slate-800 p-2 rounded text-amber-400 font-bold outline-none" />
                                        </div>
                                    </div>
                                </div>
                                <button className="w-full bg-amber-600 hover:bg-amber-500 py-3 rounded-lg font-bold flex items-center justify-center gap-2">
                                    <i data-lucide="play" className="w-5 h-5"></i> Run 60/40 Simulation
                                </button>
                            </div>
                        </div>

                        <div className="glass p-6 rounded-2xl shadow-2xl">
                            <h2 className="text-xl font-bold mb-6 text-white border-b border-white/10 pb-2">Simulation Impact</h2>
                            <div className="space-y-6">
                                <div>
                                    <h3 className="text-emerald-400 font-bold flex items-center gap-2 mb-3"><i data-lucide="trending-up" className="w-5 h-5"></i> Entered Top Allocation</h3>
                                    <div className="bg-emerald-500/10 border border-emerald-500/30 p-3 rounded-lg flex justify-between items-center mb-2">
                                        <div><div className="font-bold">Rahul Munda</div><div className="text-xs text-slate-400">NET Weight Increased</div></div>
                                        <div className="text-right"><div className="text-xs text-slate-400 line-through">Rank 120</div><div className="font-mono text-emerald-400 font-bold">Rank 42</div></div>
                                    </div>
                                </div>
                                <div>
                                    <h3 className="text-red-400 font-bold flex items-center gap-2 mb-3"><i data-lucide="trending-down" className="w-5 h-5"></i> Pushed Out</h3>
                                    <div className="bg-red-500/10 border border-red-500/30 p-3 rounded-lg flex justify-between items-center">
                                        <div><div className="font-bold">Vikram Singh</div><div className="text-xs text-slate-400">NET Score Below Threshold</div></div>
                                        <div className="text-right"><div className="text-xs text-slate-400 line-through">Rank 50</div><div className="font-mono text-red-400 font-bold">Rank 95</div></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );

            const renderApplicant = () => {
                if (submitted) {
                    return (
                        <div className="flex items-center justify-center h-[calc(100vh-80px)]">
                            <div className="glass p-12 rounded-3xl text-center max-w-lg shadow-2xl">
                                <div className="w-20 h-20 bg-emerald-500/20 rounded-full flex items-center justify-center mx-auto mb-6">
                                    <i data-lucide="check-circle" className="w-10 h-10 text-emerald-400"></i>
                                </div>
                                <h2 className="text-2xl font-bold mb-2">Application Submitted!</h2>
                                <p className="text-slate-400 mb-4">Your NFST application has been submitted. The AI engine will now verify your documents automatically.</p>
                                <div className="bg-blue-500/10 border border-blue-500/30 p-4 rounded-xl text-sm">
                                    <div className="flex justify-between mb-1"><span className="text-slate-400">Application ID:</span><span className="font-mono font-bold text-blue-400">APP-NFST-00127</span></div>
                                    <div className="flex justify-between"><span className="text-slate-400">Status:</span><span className="font-semibold text-amber-400">AI Verification In Progress</span></div>
                                </div>
                            </div>
                        </div>
                    );
                }

                return (
                    <div className="h-[calc(100vh-80px)] overflow-y-auto p-8">
                        <div className="max-w-3xl mx-auto space-y-6">

                            {/* Header */}
                            <div className="text-center mb-8">
                                <h1 className="text-3xl font-bold mb-2">NFST Fellowship Application</h1>
                                <p className="text-slate-400">National Fellowship for Scheduled Tribe Students (2025-26)</p>
                                {draftSaved && <span className="inline-block mt-2 text-xs text-emerald-400 bg-emerald-500/10 px-3 py-1 rounded-full">✓ Draft auto-saved</span>}
                            </div>

                            {/* Step 1: Required Documents Guidance */}
                            <div className="glass p-6 rounded-2xl">
                                <div className="flex justify-between items-center mb-4">
                                    <h2 className="text-lg font-bold flex items-center gap-2"><i data-lucide="info" className="w-5 h-5 text-blue-400"></i> Required Documents Checklist</h2>
                                    <span className="text-xs bg-blue-500/20 text-blue-300 px-3 py-1 rounded-full">NFST Scheme</span>
                                </div>
                                <div className="bg-black/30 p-5 rounded-xl border border-white/5 space-y-2 text-sm">
                                    <p className="text-slate-300 font-semibold mb-3">Please ensure you have the following documents ready before applying:</p>
                                    <ul className="space-y-2 text-slate-400">
                                        <li className="flex items-start gap-2"><span className="text-blue-400 mt-0.5">①</span> <span><strong className="text-white">ST Certificate</strong> — Digitally signed or issued by Tehsildar / SDM</span></li>
                                        <li className="flex items-start gap-2"><span className="text-blue-400 mt-0.5">②</span> <span><strong className="text-white">Income Certificate</strong> — Family income proof (latest financial year)</span></li>
                                        <li className="flex items-start gap-2"><span className="text-blue-400 mt-0.5">③</span> <span><strong className="text-white">Master's Degree Marksheet</strong> — Minimum 55% aggregate required</span></li>
                                        <li className="flex items-start gap-2"><span className="text-blue-400 mt-0.5">④</span> <span><strong className="text-white">NET / CSIR-NET Score Card</strong> — For merit calculation (50% weightage)</span></li>
                                        <li className="flex items-start gap-2"><span className="text-blue-400 mt-0.5">⑤</span> <span><strong className="text-white">Aadhaar Card</strong> — For identity verification (stored as masked token only)</span></li>
                                    </ul>
                                    <div className="mt-4 p-3 bg-emerald-500/10 border border-emerald-500/20 rounded-lg text-emerald-300 flex items-center gap-2">
                                        <i data-lucide="zap" className="w-4 h-4"></i>
                                        <span><strong>Pro Tip:</strong> Use DigiLocker to auto-fetch verified documents and skip manual upload entirely.</span>
                                    </div>
                                </div>
                            </div>

                            {/* Step 2: Personal Details */}
                            <div className="glass p-6 rounded-2xl">
                                <h2 className="text-lg font-bold mb-4 flex items-center gap-2"><i data-lucide="user" className="w-5 h-5 text-purple-400"></i> Personal Details</h2>
                                <div className="grid grid-cols-2 gap-4">
                                    <div>
                                        <label className="text-sm text-slate-400 block mb-1">Full Name (as per Aadhaar)</label>
                                        <input type="text" value={formData.fullName} onChange={(e) => handleFormChange('fullName', e.target.value)} placeholder="Enter your full name" className="w-full bg-black/30 border border-white/10 rounded-lg p-3 text-white placeholder-slate-600 outline-none focus:border-blue-500 transition-colors" />
                                    </div>
                                    <div>
                                        <label className="text-sm text-slate-400 block mb-1">Date of Birth</label>
                                        <input type="date" value={formData.dob} onChange={(e) => handleFormChange('dob', e.target.value)} className="w-full bg-black/30 border border-white/10 rounded-lg p-3 text-white outline-none focus:border-blue-500 transition-colors" />
                                    </div>
                                    <div>
                                        <label className="text-sm text-slate-400 block mb-1">Course Enrolled</label>
                                        <select value={formData.course} onChange={(e) => handleFormChange('course', e.target.value)} className="w-full bg-black/30 border border-white/10 rounded-lg p-3 text-white outline-none focus:border-blue-500 transition-colors">
                                            <option value="">Select course</option>
                                            <option value="mphil">M.Phil</option>
                                            <option value="phd">Ph.D</option>
                                        </select>
                                    </div>
                                    <div>
                                        <label className="text-sm text-slate-400 block mb-1">University / Institution</label>
                                        <input type="text" value={formData.university} onChange={(e) => handleFormChange('university', e.target.value)} placeholder="e.g. JNU, Delhi" className="w-full bg-black/30 border border-white/10 rounded-lg p-3 text-white placeholder-slate-600 outline-none focus:border-blue-500 transition-colors" />
                                    </div>
                                </div>
                            </div>

                            {/* Step 3: Document Upload */}
                            <div className="glass p-6 rounded-2xl">
                                <h2 className="text-lg font-bold mb-4 flex items-center gap-2"><i data-lucide="upload" className="w-5 h-5 text-amber-400"></i> Upload Documents</h2>
                                <div className="grid grid-cols-2 gap-4 mb-4">
                                    <button onClick={fetchDigiLocker} className="bg-blue-600 hover:bg-blue-500 p-4 rounded-xl font-semibold transition-colors flex items-center justify-center gap-2">
                                        <i data-lucide="cloud-download" className="w-5 h-5"></i> Fetch from DigiLocker
                                    </button>
                                    <label className="bg-purple-600 hover:bg-purple-500 p-4 rounded-xl font-semibold transition-colors flex items-center justify-center gap-2 cursor-pointer">
                                        <i data-lucide="camera" className="w-5 h-5"></i> Camera Capture
                                        <input type="file" accept="image/*" capture="environment" className="hidden" />
                                    </label>
                                </div>

                                {/* Fetched Docs */}
                                {digiDocs.length > 0 && (
                                    <div className="space-y-2 mt-4">
                                        <p className="text-sm text-emerald-400 font-semibold mb-2">✓ Documents fetched from DigiLocker:</p>
                                        {digiDocs.map((doc, i) => (
                                            <div key={i} className="flex items-center justify-between bg-emerald-500/10 border border-emerald-500/20 p-3 rounded-lg">
                                                <div className="flex items-center gap-2">
                                                    <i data-lucide={doc.icon} className="w-4 h-4 text-emerald-400"></i>
                                                    <span className="text-sm font-semibold">{doc.name}</span>
                                                </div>
                                                <span className="text-xs bg-emerald-500/20 text-emerald-300 px-2 py-0.5 rounded-full uppercase font-bold">{doc.status}</span>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>

                            {/* Submit */}
                            <button onClick={handleSubmit} disabled={submitting} className="w-full bg-gradient-to-r from-blue-600 to-purple-600 hover:from-blue-500 hover:to-purple-500 p-4 rounded-xl font-bold text-lg transition-all disabled:opacity-50 flex items-center justify-center gap-2">
                                {submitting ? (
                                    <><svg className="animate-spin h-5 w-5" viewBox="0 0 24 24"><circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4" fill="none"></circle><path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path></svg> Submitting...</>
                                ) : (
                                    <><i data-lucide="send" className="w-5 h-5"></i> Submit Application</>
                                )}
                            </button>

                        </div>
                    </div>
                );
            };

            const renderTab = () => {
                switch(activeTab) {
                    case 'applicant': return renderApplicant();
                    case 'scrutiny': return renderScrutiny();
                    case 'whatif': return renderWhatIf();
                    default: return renderApplicant();
                }
            };

            return (
                <div className="flex flex-col h-screen">
                    <nav className="h-20 border-b border-white/10 flex px-8 items-center justify-between bg-slate-900/80 backdrop-blur-md">
                        <div className="font-bold text-xl tracking-wide flex items-center gap-3">
                            <div className="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center">S</div>
                            STSC Prototype View
                        </div>
                        <div className="flex h-full">
                            <button onClick={() => setActiveTab('applicant')} className={`tab-btn ${activeTab === 'applicant' ? 'active' : ''}`}>Applicant Portal</button>
                            <button onClick={() => setActiveTab('scrutiny')} className={`tab-btn ${activeTab === 'scrutiny' ? 'active' : ''}`}>Scrutiny Workbench</button>
                            <button onClick={() => setActiveTab('whatif')} className={`tab-btn ${activeTab === 'whatif' ? 'active' : ''}`}>What-If Simulator</button>
                        </div>
                    </nav>
                    <main className="flex-1 relative">
                        {renderTab()}
                    </main>
                </div>
            );
        }
        
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
